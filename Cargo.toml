[package]
name = "tepra-cli"
version = "0.1.0"
edition = "2024"
description = "Image preparation and printer diagnostics for KING JIM TEPRA SR-MK2"
license = "MIT"

[lib]
name = "tepra_cli"
path = "src/lib.rs"

[[bin]]
name = "tepra"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
btleplug = "0.13"
clap = { version = "4.6", features = ["derive"] }
fs2 = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
nusb = { version = "0.2", features = ["tokio"] }
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "net", "io-util"] }

[dev-dependencies]
tempfile = "3"
